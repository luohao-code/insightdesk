name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端测试（Python 3.12）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行测试
        run: pytest -q --disable-warnings

      - name: 端到端冒烟测试
        run: python scripts/smoke_test.py

  frontend:
    name: 前端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 检查 ES Module 语法
        run: |
          set -e
          count=0
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
            count=$((count + 1))
          done < <(find frontend/js -name '*.js' -print0)
          echo "checked $count JavaScript modules"
          node --check frontend/sw.js

      - name: 校验 manifest 与 HTML 资源引用
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          manifest = json.loads((root / 'frontend/manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['start_url'] == './'
          html = (root / 'frontend/index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:href|src)="\./([^"]+)"', html)
          # 排除服务端路由（如 ./api/docs）与锚点，仅校验静态资源
          refs = [ref for ref in refs if not ref.startswith(('api/', '#'))]
          missing = [ref for ref in refs if not (root / 'frontend' / ref).exists()]
          assert not missing, f'missing assets: {missing}'
          print(f'validated {len(refs)} asset references')
          PY

  quality:
    name: 代码规模与质量门禁
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 代码规模检查（≥15000 行）
        run: python scripts/count_lines.py --check
      - name: 检查密钥未硬编码
        run: |
          if grep -RInE "(sk-[A-Za-z0-9]{16,}|AKID[A-Za-z0-9]{10,}|api_key\s*=\s*['\"][A-Za-z0-9_-]{12,})" backend frontend desktop run.py; then
            echo "发现疑似硬编码密钥，请移除后再提交"
            exit 1
          fi
          echo "未发现硬编码密钥"
