services:
  insightdesk:
    build: .
    container_name: insightdesk
    ports:
      - "8770:8770"
    volumes:
      - ./data:/app/data
    environment:
      INSIGHTDESK_DATA_DIR: /app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8770/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
